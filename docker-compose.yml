services:
  ollama:
    image: ollama/ollama:latest
    container_name: rma-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: rma-app
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DB_PATH=/app/data/rick_and_morty.db
      - QUERY_FILE_PATH=/app/options/ingestion_query
      - SCHEMA_JSON_PATH=/app/schema/tables_schema.json
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-2000}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.6}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    volumes:
      - ./data:/app/data
      - ./schema:/app/schema
      - ./options:/app/options
    ports:
      - "8501:8501"

volumes:
  ollama:


